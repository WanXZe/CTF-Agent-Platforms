# 西湖论剑 slab-match 平台配置（非敏感信息）
# 密钥统一放在项目根目录 .env，通过 access_key_env 引用
api_base_url: "https://pro.dasctf.com"
api_path: "/slab-match/api/v1/agent"
access_key_env: "SLAB_ACCESS_KEY"
timeout: 30

meta:
  name: "西湖论剑 slab-match"
  icon: "⚔"
  description: "西湖论剑官方比赛平台"
  type: "slab"

llm:
  default_model: "qwen-plus"
  temperature: 0.7
  max_tokens: 4096

auto_solve:
  enabled: false
  auto_download: true
  auto_start_container: true
  batch_start_unsolved: false
