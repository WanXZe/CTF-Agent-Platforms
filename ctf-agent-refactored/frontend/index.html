<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CTF Agent / 研究工作台</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/workspace.css?v=direction-v2">
  <script src="/static/workspace.js?v=direction-v2" type="module"></script>
</head>
<body>
  <aside class="rail">
    <a class="identity" href="/"><img src="/static/mark.svg" width="38" height="38" alt=""><span>CTF Agent<small>RESEARCH WORKSPACE</small></span></a>
    <span class="nav-label">工作台</span>
    <nav aria-label="工作台导航">
      <button data-view="challenges" class="nav-item selected"><span>▦</span>赛题库</button>
      <button data-view="directions" class="nav-item"><span>⌘</span>方向与模型</button>
      <button data-view="models" class="nav-item"><span>◇</span>模型连接</button>
      <button data-view="usage" class="nav-item"><span>▥</span>调用用量</button>
    </nav>
    <div class="rail-note"><span class="live-dot"></span><strong id="serviceStatus">连接中</strong><p>分析、运行和记录<br>在同一个工作空间。</p></div>
    <div class="rail-bottom"><span>CTF / AI</span><button id="appearance" aria-label="切换明暗主题">◐</button></div>
  </aside>
  <div class="desktop">
    <header class="masthead"><div class="breadcrumb">工作空间 <span>/</span> <strong id="locationLabel">赛题库</strong></div><div class="masthead-actions"><label for="platformPicker">当前平台</label><select id="platformPicker" aria-label="当前平台"></select><button class="quiet" id="registerPlatform">＋ 添加平台</button></div></header>
    <main id="workspace" aria-live="polite"><div class="empty">正在加载工作空间…</div></main>
    <footer class="page-foot"><span>CTF Agent · 研究工作台</span><span>完整日志持续归档</span></footer>
  </div>
  <dialog id="modelEditor" aria-labelledby="modelEditorTitle">
    <form id="connectionForm"><div class="modal-heading"><div><span class="eyebrow">MODEL CONNECTION</span><h2 id="modelEditorTitle">添加模型连接</h2></div><button type="button" class="icon-close" data-close="modelEditor" aria-label="关闭模型编辑">×</button></div>
      <p class="subtle">保存后，新开始的解题任务会使用更新后的连接信息。</p>
      <div class="field-grid"><label>模型名称<input name="name" required maxlength="200" placeholder="例如 deepseek-flash"></label><label>提供商<input name="provider" placeholder="例如 deepseek"></label><label class="wide">接口地址<input name="base_url" required type="url" placeholder="https://api.example.com/v1"></label><label class="wide">密钥环境变量名<input name="api_key_env" pattern="[A-Za-z_][A-Za-z0-9_]{0,127}" placeholder="例如 DEEPSEEK_API_KEY"><small>密钥内容保存在服务端 .env 中；本地无密钥服务可留空。</small></label></div>
      <p class="form-error" id="modelEditorError" role="alert"></p><div class="modal-foot"><button type="button" class="secondary" data-close="modelEditor">取消</button><button class="primary" type="submit">保存连接</button></div>
    </form>
  </dialog>
  <dialog id="platformEditor" aria-labelledby="platformEditorTitle"><form id="platformForm"><div class="modal-heading"><h2 id="platformEditorTitle">添加 CTFd 平台</h2><button type="button" class="icon-close" data-close="platformEditor" aria-label="关闭平台编辑">×</button></div><div class="field-grid"><label>平台名称<input name="name" required maxlength="80"></label><label>平台 ID<input name="id" required pattern="[a-z][a-z0-9-]{1,31}" placeholder="my-ctf"></label><label class="wide">平台地址<input name="api_base_url" required type="url" placeholder="https://ctf.example.com"></label><label class="wide">密钥环境变量名<input name="access_key_env" required pattern="[A-Z][A-Z0-9_]{1,63}" value="CTFD_TOKEN"></label></div><p class="subtle">在服务端 .env 配置相应 Token 后即可连接。</p><p class="form-error" id="platformEditorError" role="alert"></p><div class="modal-foot"><button type="button" class="secondary" data-close="platformEditor">取消</button><button class="primary" type="submit">创建平台</button></div></form></dialog>
  <div id="notifications" aria-live="polite" role="status"></div>
</body>
</html>
