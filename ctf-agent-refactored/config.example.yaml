platform:
  type: slab
  api_base_url: https://pro.dasctf.com
  api_path: /slab-match/api/v1/agent
  access_key_env: SLAB_ACCESS_KEY
llm:
  default_model: qwen3:4b
  base_url: http://127.0.0.1:11434/v1
  api_key_env: ""
  local_base_url: http://127.0.0.1:11434/v1
  temperature: 0.7
  max_tokens: 4096
  timeout: 300
  models:
    - name: qwen3:4b
      provider: ollama
      base_url: http://127.0.0.1:11434/v1
      api_key_env: ""
  category_models: {}
local:
  root: ./challenges
solver:
  max_concurrent_challenges: 2
  max_rounds: 40
  token_budget: 100000
  max_attempts_per_challenge: 3
container:
  default_timeout: 120
  poll_interval: 3
  auto_recover: false
sandbox:
  mode: docker
  image: ctf-sandbox:latest
  memory_limit: 8g
  cpu_limit: 2
web:
  host: 0.0.0.0
  port: 12346
logging:
  level: INFO
